<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Highlight Toggle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .highlight {
      background-color: yellow;
    }
  </style>
</head>
<body>
  <div class="container text-center mt-4">
    <p id="textPara">This is a sample paragraph to be highlighted.</p>
    <button id="highlightBtn" class="btn btn-primary">Highlight</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const btn = document.getElementById('highlightBtn');
      const para = document.getElementById('textPara');

      btn.addEventListener('click', function () {
        para.classList.toggle('highlight');
      });
    });
  </script>
</body>
</html>
