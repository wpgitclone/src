<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .image-container {
      position: relative;
      width: 300px;
      height: 540px;
      margin: 30px auto 0;
    }
    .layered-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 300px;
      height: 540px;
      object-fit: cover;
      border: 1px solid #000;
    }
    /* slight offsets so the overlap is visible */
    #img2 { top: 2px; left: 4px; }
    #img3 { top: 4px; left: 8px; }
  </style>
</head>
<body>
  <div class="container text-center mt-4">
    <div class="d-flex justify-content-center gap-2">
      <button id="btn1" class="btn btn-primary">Image 1</button>
      <button id="btn2" class="btn btn-success">Image 2</button>
      <button id="btn3" class="btn btn-danger">Image 3</button>
    </div>

    <div class="image-container">
      <img id="img1" class="layered-img" style="z-index: 1;"
           src="https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=600" alt="Image 1">
      <img id="img2" class="layered-img" style="z-index: 2;"
           src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=600" alt="Image 2">
      <img id="img3" class="layered-img" style="z-index: 3;"
           src="https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=600" alt="Image 3">
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const images = {
        btn1: 'img1',
        btn2: 'img2',
        btn3: 'img3'
      };

      Object.keys(images).forEach(function (btnId) {
        document.getElementById(btnId).addEventListener('click', function () {
          ['img1', 'img2', 'img3'].forEach(function (imgId) {
            document.getElementById(imgId).style.zIndex = (imgId === images[btnId]) ? '10' : '1';
          });
        });
      });
    });
  </script>
</body>
</html>
