<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Image Showcase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container text-center mt-5">
        <div class="mb-5">
            <button id="btn1" class="btn btn-primary mx-2">Image 1</button>
            <button id="btn2" class="btn btn-primary mx-2">Image 2</button>
            <button id="btn3" class="btn btn-primary mx-2">Image 3</button>
        </div>
        <div class="image-container mx-auto">
            <img src="img1.jpg" id="img1" class="layered-img" alt="Image 1">
            <img src="img2.jpg" id="img2" class="layered-img" alt="Image 2">
            <img src="img3.jpg" id="img3" class="layered-img" alt="Image 3">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
